<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>测测你的隐藏打工魂</title>
    <style>
        :root {
            --bg-color: #0f0c1b;
            --card-bg: #1a1528;
            --primary-color: #ff6b9d;
            --text-color: #e0d9f0;
            --text-sub: #8a7e9f;
            --gradient: linear-gradient(135deg, #ff6b9d 0%, #9d65ff 100%);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 480px; padding: 20px; display: flex; flex-direction: column; position: relative; }
        
        #home-page { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; text-align: center; }
        .title { font-size: 32px; font-weight: bold; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
        .subtitle { color: var(--text-sub); margin-bottom: 40px; font-size: 14px; }
        .btn { background: var(--gradient); color: white; border: none; padding: 15px 40px; border-radius: 30px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 107, 157, 0.4); transition: transform 0.2s; width: 80%; }
        .btn:active { transform: scale(0.95); }

        #quiz-page { display: none; flex-direction: column; flex: 1; }
        .progress-bar { width: 100%; height: 6px; background: #2a233b; border-radius: 3px; margin: 20px 0 40px; overflow: hidden; }
        .progress { width: 0%; height: 100%; background: var(--gradient); transition: width 0.3s; }
        .question-text { font-size: 20px; line-height: 1.5; margin-bottom: 30px; font-weight: 500; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { background: var(--card-bg); border: 1px solid #2a233b; padding: 16px 20px; border-radius: 15px; font-size: 15px; cursor: pointer; transition: all 0.2s; }
        .option:active { border-color: var(--primary-color); background: #241b38; transform: translateX(5px); }

        #result-page { display: none; flex-direction: column; flex: 1; padding-bottom: 40px; }
        .result-header { text-align: center; margin-top: 20px; margin-bottom: 30px; }
        .result-title { font-size: 28px; font-weight: bold; color: #00e5ff; text-shadow: 0 0 10px rgba(0, 229, 255, 0.5); margin-bottom: 10px; }
        .result-desc { font-size: 14px; color: var(--text-sub); }
        .card { background: var(--card-bg); border-radius: 20px; padding: 20px; margin-bottom: 20px; border: 1px solid #2a233b; }
        .card-title { font-size: 16px; font-weight: bold; margin-bottom: 15px; display: flex; justify-content: space-between; }
        .score-box { display: flex; justify-content: space-around; text-align: center; margin-bottom: 20px; }
        .score-num { font-size: 32px; font-weight: bold; color: var(--primary-color); }
        .score-label { font-size: 12px; color: var(--text-sub); }
        canvas { width: 100%; height: 260px; display: block; }
        .tag-item { margin-bottom: 15px; border-bottom: 1px solid #2a233b; padding-bottom: 15px; }
        .tag-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .tag-name-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .tag-name { font-size: 18px; font-weight: bold; color: #fff; }
        .tag-match { font-size: 18px; font-weight: bold; color: var(--primary-color); }
        .tag-desc { font-size: 13px; color: var(--text-sub); line-height: 1.4; }
        .tag-advice { font-size: 12px; background: rgba(255, 107, 157, 0.1); color: #ff9fba; padding: 8px 12px; border-radius: 8px; margin-top: 10px; display: inline-block; }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="home-page">
            <h1 class="title">隐藏打工魂剧本</h1>
            <p class="subtitle">测测你的真实精神状态与人设</p>
            <button class="btn" onclick="startQuiz()">开始探索</button>
        </div>
        <div id="quiz-page">
            <div class="progress-bar"><div class="progress" id="progress"></div></div>
            <div class="question-text" id="question-text">题目加载中...</div>
            <div class="options" id="options-container"></div>
        </div>
        <div id="result-page">
            <div class="result-header">
                <div class="result-title" id="res-type">加载中...</div>
                <div class="result-desc" id="res-subtitle"></div>
            </div>
            <div class="card">
                <div class="score-box">
                    <div>
                        <div class="score-num" id="res-total">0</div>
                        <div class="score-label">精神稳定值</div>
                    </div>
                    <div>
                        <div class="score-num" id="res-strength">0%</div>
                        <div class="score-label">社会化程度</div>
                    </div>
                </div>
                <div class="card-title">精神维度雷达图</div>
                <canvas id="radarChart" width="300" height="260"></canvas>
            </div>
            <div class="card">
                <div class="card-title">你的专属人设标签 TOP 4</div>
                <div id="tags-container"></div>
            </div>
            <button class="btn" style="margin: 20px auto;" onclick="location.reload()">重新测试</button>
        </div>
    </div>

    <script>
        const questions = [
            { q: "早晨闹钟响的那一刻，你脑海中最真实的念头是？", opts: [{t:"立刻在脑子里规划出今天要做的最重要的三件事", d:"order"}, {t:"幻想自己是个不用上班的野人，在森林里自由奔跑", d:"nature"}, {t:"已经想好怎么跟老板请病假的话术了", d:"language"}, {t:"每天都在怀疑自己为什么要在这个破地方受苦", d:"introspective"}] },
            { q: "在公司/学校的电梯里遇到半熟不熟的同事，你的反应是？", opts: [{t:"只要我不尴尬，尴尬的就是别人，微笑点头", d:"order"}, {t:"疯狂在大脑里检索对方的名字，怕叫错", d:"introspective"}, {t:"主动找话题：“哎你今天衣服真好看！”", d:"empathy"}, {t:"假装低头看手机，祈祷电梯快点到", d:"nature"}] },
            { q: "刷手机时，哪种内容最容易让你停下手指？", opts: [{t:"极简风/高级感的穿搭或家居布置", d:"aesthetic"}, {t:"揭露某种行业潜规则或者硬核干货数据贴", d:"logic"}, {t:"搞笑段子、发疯文学或者奇葩人类大赏", d:"chaos"}, {t:"流浪动物救助、唯美的风景旅拍", d:"nature"}] },
            { q: "团队讨论方案时，你最受不了哪种人？", opts: [{t:"毫无逻辑，全靠感觉乱说的人", d:"logic"}, {t:"只会挑刺，自己又拿不出好方案的人", d:"extreme"}, {t:"磨磨唧唧，迟迟不拍板的人", d:"order"}, {t:"完全不顾及别人感受，说话很难听的人", d:"empathy"}] },
            { q: "如果你现在拥有了一项可以改变世界的能力，你希望是？", opts: [{t:"瞬间建好一栋充满未来科技感的大楼", d:"spatial"}, {t:"让所有人的负面情绪立刻消失", d:"empathy"}, {t:"能听懂所有动植物在说什么", d:"nature"}, {t:"让所有人都能心平气和地听我讲道理", d:"language"}] },
            { q: "朋友发来一条 60 秒的语音方阵，你会？", opts: [{t:"直接转文字，快速扫一眼核心信息", d:"logic"}, {t:"戴上耳机耐心听完，感受TA的语气", d:"empathy"}, {t:"不想听，直接回个表情包糊弄过去", d:"chaos"}, {t:"找个安静的地方，边听边在脑子里构思怎么回复", d:"introspective"}] },
            { q: "给你一个完全不用考虑赚钱的 Gap Year，你最想去干嘛？", opts: [{t:"去深山老林里租个小院子，种花养狗", d:"nature"}, {t:"报个班学画画、陶艺或者做个独立游戏", d:"aesthetic"}, {t:"环游世界，去体验各种极限运动", d:"chaos"}, {t:"闷在家里疯狂看书，研究哲学、心理学", d:"introspective"}] },
            { q: "面对一项极其枯燥但必须完成的 Excel 表格任务，你会？", opts: [{t:"弄个公式一键搞定，哪怕研究公式要花半小时", d:"logic"}, {t:"戴上耳机，放点激情的BGM，硬着头皮猛干", d:"extreme"}, {t:"弄个好看的配色和排版，让它看起来顺眼点", d:"aesthetic"}, {t:"边填边骂，摸鱼十分钟填表一分钟", d:"chaos"}] },
            { q: "别人夸你“聪明”和“靠谱”，你更希望是哪个？", opts: [{t:"聪明。说明我脑子转得快，有创造力", d:"aesthetic"}, {t:"靠谱。说明我执行力强，细节控", d:"order"}, {t:"聪明。说明我逻辑严密，一眼看透本质", d:"logic"}, {t:"靠谱。说明我能给人安全感", d:"empathy"}] },
            { q: "你最喜欢在朋友圈发什么？", opts: [{t:"自己拍的高级感大片或看展日常", d:"aesthetic"}, {t:"深夜网抑云，或者一些关于人生的碎碎念", d:"introspective"}, {t:"吐槽工作/生活中的奇葩遭遇，自带段子属性", d:"language"}, {t:"风景照、小动物、花花草草", d:"nature"}] },
            { q: "在一场剧本杀里，你最想抽到的角色是？", opts: [{t:"逻辑严密的推土机，靠线索锁死凶手", d:"logic"}, {t:"疯狂带节奏、能把黑说成白的搅屎棍", d:"language"}, {t:"掌握核心机关或者建筑图纸的技术流", d:"spatial"}, {t:"情感线极重，全场哭得最惨的C位", d:"empathy"}] },
            { q: "如果你要自己组装一个宜家衣柜，你会？", opts: [{t:"严格按照图纸，一步步来，螺丝一个不能多", d:"order"}, {t:"先把所有板子摊开，在脑子里建个模再动手", d:"spatial"}, {t:"随便拼，能立起来就行，外观不重要", d:"chaos"}, {t:"一边拼一边吐槽这反人类的设计", d:"extreme"}] },
            { q: "如果突然被拉到台上发言，你的第一反应是？", opts: [{t:"心跳加速，但能迅速整理好思路开始输出", d:"language"}, {t:"脑子一片空白，希望有人赶紧来救场", d:"introspective"}, {t:"随便讲个笑话，先把大家逗乐再说", d:"chaos"}, {t:"还好我平时看的东西多，可以引经据典", d:"logic"}] },
            { q: "周末你更倾向于哪种充电方式？", opts: [{t:"一个人宅着，谁也别理我", d:"introspective"}, {t:"去人声鼎沸的商场或者Livehouse感受人气", d:"language"}, {t:"去公园躺草坪或者去爬山", d:"nature"}, {t:"去玩密室逃脱或者看一场烧脑电影", d:"spatial"}] },
            { q: "如果世界是个巨大的草台班子，你觉得你在这个班子里是？", opts: [{t:"那个负责修音响、搭台子的技术工", d:"spatial"}, {t:"那个在台下疯狂吐槽的观众", d:"language"}, {t:"那个试图把班子重新整顿好的导演", d:"order"}, {t:"那个在后台默默种花的NPC", d:"nature"}] },
            { q: "以下哪个词最能让你破防？", opts: [{t:"“你连这都不懂？”", d:"logic"}, {t:"“你这人真没意思。”", d:"chaos"}, {t:"“你的方案毫无美感。”", d:"aesthetic"}, {t:"“你怎么这么自私？”", d:"empathy"}] },
            { q: "看到不公的事情，你体内哪种血液最沸腾？", opts: [{t:"想要立刻长篇大论去反击", d:"language"}, {t:"想把背后的社会结构问题扒出来", d:"logic"}, {t:"同情受害者，想给他们提供帮助", d:"empathy"}, {t:"气到想毁灭世界，直接掀桌子", d:"extreme"}] },
            { q: "在挑选家具时，你最看重的是？", opts: [{t:"颜色和颜值必须过关", d:"aesthetic"}, {t:"尺寸必须严丝合缝，动线要合理", d:"spatial"}, {t:"收纳功能强不强，好不好清洁", d:"order"}, {t:"最好是用原木、环保材料", d:"nature"}] },
            { q: "别人说你“想太多”，通常是因为你在干什么？", opts: [{t:"思考宇宙的尽头和人生的意义", d:"introspective"}, {t:"因为一个细节，推演出一整部连续剧", d:"logic"}, {t:"总是害怕自己刚才说的话伤害到别人", d:"empathy"}, {t:"觉得大家都太俗了，没人懂我的艺术", d:"aesthetic"}] },
            { q: "发现了一个极其小众的宝藏兴趣，你会？", opts: [{t:"自己偷偷玩，不想让任何人发现", d:"introspective"}, {t:"立刻发朋友圈，安利给所有人", d:"language"}, {t:"深入钻研，研究它的起源和底层逻辑", d:"logic"}, {t:"觉得它太美了，想把它发扬光大", d:"aesthetic"}] },
            { q: "如果你要写一本小说，你会写什么题材？", opts: [{t:"极其严密的科幻悬疑推理", d:"logic"}, {t:"探讨人性幽暗深处的意识流文学", d:"introspective"}, {t:"沙雕搞笑、各种反转的无厘头爽文", d:"chaos"}, {t:"治愈人心的自然田园日常", d:"nature"}] },
            { q: "走在街上，你更容易被什么吸引视线？", opts: [{t:"极具设计感的橱窗陈列", d:"aesthetic"}, {t:"街边突然跑过去的小猫小狗", d:"nature"}, {t:"两个人在角落里激烈争吵", d:"empathy"}, {t:"建筑外墙上奇怪的钢筋结构", d:"spatial"}] },
            { q: "面对一个总是甩锅的同事，你会怎么处理？", opts: [{t:"收集证据，用邮件和数据把锅甩回去", d:"logic"}, {t:"直接当场跟他开撕，把他怼到哑口无言", d:"extreme"}, {t:"先和周围人搞好关系，让他被孤立", d:"language"}, {t:"忍气吞声，回去内耗一整晚", d:"introspective"}] },
            { q: "如果有一天你暴富了，你最想买的终极奢侈品是？", opts: [{t:"一个拥有顶级安保和设计的私人岛屿别墅", d:"spatial"}, {t:"包下一座山头，建一个流浪动物救助基地", d:"nature"}, {t:"举办一场由我亲自设计的全球顶级艺术节", d:"aesthetic"}, {t:"什么都不买，直接躺平，雇人替我打工", d:"chaos"}] }
        ];

        const dims = { logic: "理性脑", aesthetic: "审美感", empathy: "共情力", language: "社交嘴替", spatial: "空间构建", order: "秩序感", introspective: "精神内耗", nature: "自然松弛", chaos: "混沌发疯", extreme: "极端偏执" };
        
        const tagDB = {
            logic: [{n:"人间清醒大明白", d:"智商在线，看破不说破的理中客"},{n:"硬核数据狂魔", d:"用事实说话，拒绝废话"},{n:"逻辑闭环大师", d:"你的大脑像个精密的计算机"},{n:"理性吃瓜第一人", d:"绝不站队，只看证据"}],
            aesthetic: [{n:"颜值即正义", d:"审美极佳，看脸看穿搭"},{n:"朋友圈视觉总监", d:"你的图不精修绝不发"},{n:"生活美学博主", d:"你买的不仅是东西，是氛围感"},{n:"赛博外貌协会会员", d:"颜值是一切故事的敲门砖"}],
            empathy: [{n:"情绪树洞担当", d:"朋友的最佳倾诉对象"},{n:"中央空调小暖炉", d:"共情能力太强，看新闻都会哭"},{n:"人类和平大使", d:"吵架时最温柔的和事佬"},{n:"重度护崽狂魔", d:"对在乎的人极度护短"}],
            language: [{n:"社交悍匪/社牛", d:"只要你不尴尬，尴尬的就是别人"},{n:"互联网顶级嘴替", d:"你的表达总能精准戳中人心"},{n:"逻辑带师辩论手", d:"没人能在你的BGM里吵赢你"},{n:"高情商沟通专家", d:"向上管理、向下兼容的社交王者"}],
            spatial: [{n:"二次元造梦师", d:"脑内自带3D建模引擎"},{n:"路痴界的绝缘体", d:"天塌下来你也能看懂地图"},{n:"解谜游戏收割机", d:"空间拼图大师"},{n:"建筑美学猎人", d:"总是能从结构中发现美"}],
            order: [{n:"究极J人强迫症", d:"所有的东西必须待在该待的地方"},{n:"日程表狂魔", d:"P人地狱，你是时间管理大师"},{n:"搞钱/搞事第一线", d:"执行力超强，想什么立刻做"},{n:"靠谱成年人", d:"只要有你在，项目就不会崩"}],
            introspective: [{n:"重度精神内耗患者", d:"白天哈哈哈，深夜网抑云"},{n:"孤独的哲学家", d:"享受独处，脑内小剧场极其丰富"},{n:"高敏感星人", d:"对世界万物有着细腻的感知"},{n:"佛系修仙选手", d:"比起社交，更想一个人发呆"}],
            nature: [{n:"极品松弛感人类", d:"万事不急，顺其自然"},{n:"花草猫狗交流官", d:"看到流浪动物就走不动道"},{n:"反内卷先锋", d:"只要我躺得够平，资本就剥削不到我"},{n:"大自然野生代颜人", d:"比起城市的喧嚣，更爱山野的风"}],
            chaos: [{n:"发疯文学十级学者", d:"精神状态领先正常人十年"},{n:"脑洞黑洞制造机", d:"思维极其跳脱，没人跟得上你"},{n:"搞笑女/男实锤", d:"你是朋友圈的快乐瀑布"},{n:"薛定谔的社恐", d:"遇到熟人社牛，遇到生人社恐"}],
            extreme: [{n:"纯爱/纯恨战神", d:"要么爱到底，要么滚远点"},{n:"偏执型完美主义", d:"要么不做，要做就做到极致"},{n:"暴脾气小辣椒", d:"拒绝内耗，有气当场就撒"},{n:"不疯魔不成活", d:"执着于自己认定的真理"}]
        };

        let currentQ = 0;
        let scores = { logic:0, aesthetic:0, empathy:0, language:0, spatial:0, order:0, introspective:0, nature:0, chaos:0, extreme:0 };
        let hiddenFlags = { q15: false, q19: false, q23: false };

        function startQuiz() { document.getElementById('home-page').style.display = 'none'; document.getElementById('quiz-page').style.display = 'flex'; renderQuestion(); }
        
        function renderQuestion() {
            if (currentQ >= questions.length) { showResult(); return; }
            const qData = questions[currentQ];
            document.getElementById('question-text').innerText = qData.q;
            document.getElementById('progress').style.width = ((currentQ) / questions.length) * 100 + '%';
            const optsContainer = document.getElementById('options-container');
            optsContainer.innerHTML = '';
            qData.opts.forEach(opt => {
                const btn = document.createElement('div');
                btn.className = 'option'; btn.innerText = opt.t; btn.onclick = () => selectOption(opt.d);
                optsContainer.appendChild(btn);
            });
        }

        function selectOption(dim) {
            if (currentQ === 14 && dim === 'chaos') hiddenFlags.q15 = true;
            if (currentQ === 18 && dim === 'extreme') hiddenFlags.q19 = true;
            if (currentQ === 22 && dim === 'extreme') hiddenFlags.q23 = true;
            scores[dim] = (scores[dim] || 0) + 1;
            currentQ++;
            const quizPage = document.getElementById('quiz-page');
            quizPage.style.opacity = '0';
            setTimeout(() => { renderQuestion(); quizPage.style.opacity = '1'; }, 150);
        }

        function showResult() {
            document.getElementById('quiz-page').style.display = 'none';
            document.getElementById('result-page').style.display = 'flex';
            let isEasterEgg = false; let typeName = ""; let typeDesc = "";
            
            if (hiddenFlags.q15 && hiddenFlags.q19 && hiddenFlags.q23) { 
                isEasterEgg = true; typeName = "🤡 纯正发疯文学大师"; typeDesc = "你的精神状态遥遥领先，正常人类已经无法理解你的脑回路了！"; 
            }
            else if (scores.introspective >= 3 && scores.nature >= 3) { 
                isEasterEgg = true; typeName = "🌿 绝版隐世修仙党"; typeDesc = "世俗的欲望与你无关，你只想在深山老林里发呆。"; 
            }
            else {
                const sortedDims = Object.keys(scores).filter(k => !['chaos', 'extreme'].includes(k)).sort((a,b) => scores[b] - scores[a]);
                const top1 = sortedDims[0];
                typeName = top1 === 'aesthetic' ? "人间富贵花/颜控型" : top1 === 'logic' ? "人间清醒理智型" : top1 === 'empathy' ? "暖心情绪价值型" : top1 === 'language' ? "社交悍匪/嘴替型" : top1 === 'spatial' ? "二次元造梦型" : top1 === 'order' ? "靠谱J人掌控型" : top1 === 'introspective' ? "高敏内耗哲学家" : "极品松弛感选手";
                typeDesc = "你的核心特质是【" + dims[top1] + "】，这决定了你的社交人设。";
            }
            
            document.getElementById('res-type').innerText = typeName;
            document.getElementById('res-subtitle').innerText = typeDesc;
            
            let totalScore = 0; let radarData = [];
            const coreDims = ['logic', 'spatial', 'aesthetic', 'language', 'empathy', 'introspective', 'nature', 'order'];
            coreDims.forEach(k => { totalScore += scores[k]; radarData.push({ label: dims[k], val: scores[k] }); });
            
            let displayTotal = 100 - Math.min(Math.round((scores.introspective + scores.chaos + scores.extreme) * 8), 80); 
            if(displayTotal < 20) displayTotal = 20; 
            
            document.getElementById('res-total').innerText = displayTotal;
            document.getElementById('res-strength').innerText = Math.min(Math.round((totalScore/12)*100), 99) + "%";
            
            drawRadar(radarData);
            renderTags(isEasterEgg);
        }

        function drawRadar(data) {
            const canvas = document.getElementById('radarChart'); const ctx = canvas.getContext('2d');
            const w = canvas.width; const h = canvas.height; const cx = w / 2; const cy = h / 2; const r = 90; const angle = (Math.PI * 2) / data.length;
            ctx.clearRect(0, 0, w, h); ctx.translate(cx, cy);
            ctx.strokeStyle = '#2a233b'; ctx.lineWidth = 1;
            for (let level = 1; level <= 4; level++) {
                ctx.beginPath();
                for (let i = 0; i < data.length; i++) {
                    const x = Math.cos(angle * i - Math.PI/2) * (r * level / 4); const y = Math.sin(angle * i - Math.PI/2) * (r * level / 4);
                    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                }
                ctx.closePath(); ctx.stroke();
            }
            ctx.fillStyle = '#8a7e9f'; ctx.font = '10px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            for (let i = 0; i < data.length; i++) {
                const x = Math.cos(angle * i - Math.PI/2) * r; const y = Math.sin(angle * i - Math.PI/2) * r;
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(x, y); ctx.stroke();
                const textX = Math.cos(angle * i - Math.PI/2) * (r + 15); const textY = Math.sin(angle * i - Math.PI/2) * (r + 15);
                ctx.fillText(data[i].label, textX, textY);
            }
            ctx.beginPath();
            for (let i = 0; i < data.length; i++) {
                let val = data[i].val > 5 ? 5 : data[i].val; 
                const x = Math.cos(angle * i - Math.PI/2) * (r * val / 5); const y = Math.sin(angle * i - Math.PI/2) * (r * val / 5);
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.closePath(); ctx.fillStyle = 'rgba(255, 107, 157, 0.4)'; ctx.fill(); ctx.strokeStyle = '#ff6b9d'; ctx.lineWidth = 2; ctx.stroke();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
        }

        function renderTags(isEasterEgg) {
            const container = document.getElementById('tags-container'); container.innerHTML = '';
            const sortedDims = Object.keys(scores).filter(k => !['chaos', 'extreme'].includes(k)).sort((a,b) => scores[b] - scores[a]);
            let selectedTags = [];
            
            if (isEasterEgg) { 
                selectedTags = [...tagDB.chaos, ...tagDB.extreme]; 
            } else {
                const top1 = sortedDims[0]; const top2 = sortedDims[1];
                selectedTags = [...tagDB[top1]];
                if (selectedTags.length < 4) { selectedTags = selectedTags.concat(tagDB[top2]); }
                selectedTags = selectedTags.slice(0, 4);
            }
            
            let matchScores = [98, 95, 89, 85];
            selectedTags.forEach((tag, index) => {
                const div = document.createElement('div'); div.className = 'tag-item';
                div.innerHTML = `<div class="tag-name-row"><div class="tag-name">${tag.n}</div><div class="tag-match">${matchScores[index]}%</div></div><div class="tag-desc">${tag.d}</div><div class="tag-advice">测出该标签的你，是人群中非常独特的存在！</div>`;
                container.appendChild(div);
            });
        }
    </script>
